name: Bug report
description: Report a reproducible problem in iTune
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, search existing issues for the same problem. For security vulnerabilities, do not use this public form; follow [SECURITY.md](../../SECURITY.md).
  - type: input
    id: app-version
    attributes:
      label: iTune version
      description: Include the release version or commit/build identifier.
      placeholder: e.g. 2.1.0
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: e.g. Android 14
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Device model and, if relevant, chipset
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Tap…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, account details, personal information, and other secrets before posting.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability report.
          required: true
