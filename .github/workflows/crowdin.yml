name: Crowdin Android translations

on:
  push:
    branches: [main]
    paths:
      - app/src/main/res/values/strings.xml
      - crowdin.yml
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:
    inputs:
      import_existing:
        description: Import existing Android translations into Crowdin
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crowdin-android-translations
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'd0x-dev/iTune' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check Crowdin credentials
        id: credentials
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          if [[ -n "$CROWDIN_PERSONAL_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::error::Set the CROWDIN_PERSONAL_TOKEN repository secret to enable sync."
            exit 1
          else
            echo "::notice::Crowdin sync is waiting for the CROWDIN_PERSONAL_TOKEN repository secret."
          fi

      - name: Check out Android source
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Sync with Crowdin
        if: steps.credentials.outputs.configured == 'true'
        uses: crowdin/github-action@d651c77756acbe11a31d77a6fb79d8a239e1e05a # v3.6.0
        with:
          config: crowdin.yml
          upload_sources: true
          upload_translations: ${{ inputs.import_existing == true }}
          download_translations: ${{ github.event_name != 'push' && inputs.import_existing != true }}
          skip_untranslated_strings: true
          localization_branch_name: crowdin/android-translations
          pull_request_base_branch_name: main
          commit_message: "Update Android translations from Crowdin"
          pull_request_title: "Update Android translations from Crowdin"
          pull_request_body: "Review the Android string updates exported from [Crowdin](https://crowdin.com/project/itune)."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
